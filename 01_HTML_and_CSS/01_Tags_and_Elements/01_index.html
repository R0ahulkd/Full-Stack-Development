<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags</title>
</head>
<body>
    <!-- 1. Conatiner Tag-->
     <h1>Hello world</h1>
     <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Doloremque, sed!</p>

    <!-- 2. Non-Container Tag-->
     <hr>

    <!-- 3. Nested Tags-->
     <div>
        <h1>Rahul Kumar</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sunt qui architecto, vel eaque ducimus suscipit corporis culpa aperiam temporibus. Expedita?
        </p>
     </div>
</body>
</html>
